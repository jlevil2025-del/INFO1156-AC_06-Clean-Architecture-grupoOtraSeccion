sonar.projectKey=hotel-proyecto
sonar.projectName=INFO1156-AC_06-Clean-Architecture
sonar.language=ts
sonar.sourceEncoding=UTF-8

sonar.sources=src/posts
sonar.exclusions=src/posts/**/*.d.ts,src/posts/feed-ranking.strategy.ts

sonar.tests=tests
sonar.test.inclusion=tests/**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
